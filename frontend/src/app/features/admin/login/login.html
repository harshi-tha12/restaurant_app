<div class="login-page">

    <div class="login-card">

        <h2>Admin Login</h2>

        <input
            type="text"
            [(ngModel)]="username"
            placeholder="Username">

        <input
            type="password"
            [(ngModel)]="password"
            placeholder="Password">

        <button (click)="login()">

            Login

        </button>

    </div>

</div>
