<section class="category-section">

    <h2>Browse Categories</h2>

    <div class="category-container">

        <div
            class="category-card"
            *ngFor="let category of categories">

            <span class="material-icons category-icon">
                {{category.icon}}
            </span>

            <h5>{{category.name}}</h5>

        </div>

    </div>

</section>
